name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [bun-linux-x64, bun-linux-arm64, bun-darwin-x64, bun-darwin-arm64, bun-windows-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - name: Compilar ${{ matrix.target }}
        run: |
          name="jukeboxdl-${{ matrix.target }}"
          name="${name/bun-/}"
          [[ "${{ matrix.target }}" == *windows* ]] && name="$name.exe"
          bun scripts/build-binary.ts ${{ matrix.target }} "dist/$name"
      - name: Testar o binário sem node_modules (só linux-x64, que roda neste runner)
        if: matrix.target == 'bun-linux-x64'
        run: |
          # Sem o node_modules, o binário só funciona se tudo estiver embutido nele.
          mv node_modules "$RUNNER_TEMP/node_modules"
          export JUKEBOXDL_HOME="$(mktemp -d)"
          ./dist/jukeboxdl-linux-x64 --version
          ./dist/jukeboxdl-linux-x64 history -n 1
          mv "$RUNNER_TEMP/node_modules" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/jukeboxdl-*

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum jukeboxdl-* > SHA256SUMS
      - name: Notas da versão a partir do CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Versão $version." > notes.md
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
